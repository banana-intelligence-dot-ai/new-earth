<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>New Earth: a gravity slingshot game with 100 levels</title>
<meta name="description" content="Pull back, let go, and let gravity bend one rocket from Earth to a new one. No steering. 100 levels that get harder. Free, in your browser.">
<link rel="canonical" href="https://new-earth-omega.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="New Earth">
<meta property="og:title" content="New Earth: one launch, no steering, 100 levels">
<meta property="og:description" content="Pull back, let go, and let gravity bend your rocket to New Earth.">
<meta property="og:url" content="https://new-earth-omega.vercel.app/">
<meta property="og:image" content="https://new-earth-omega.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A small rocket slingshots past a star toward New Earth.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="New Earth: one launch, no steering, 100 levels">
<meta name="twitter:description" content="Pull back, let go, and let gravity bend your rocket to New Earth.">
<meta name="twitter:image" content="https://new-earth-omega.vercel.app/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#050505;--ink:#f2f2f2;--dim:#8b8b8b;--line:#2a2a2a;--panel:#0d0d0d;--sun:#FFD23F;--new:#6FA8FF;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
/* The game fills the whole screen: the canvas covers it, and the header and controls sit on top. */
header{position:fixed;z-index:2;top:0;left:0;right:0;display:flex;align-items:baseline;gap:16px;pointer-events:none;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
#ui{position:fixed;z-index:2;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;
  padding:10px max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:linear-gradient(to top,rgba(5,5,5,.96) 70%,rgba(5,5,5,0))}
h1{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.hud{font-family:var(--mono);font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud b{color:var(--ink);font-weight:500}
#tries{margin-left:auto}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:crosshair;outline:none;touch-action:none;background:#000}
canvas:focus-visible{box-shadow:inset 0 0 0 2px var(--new)}
#note{flex:1 1 260px;min-height:2.9em;font-size:16px;line-height:1.45;color:var(--ink);display:flex;align-items:center}
#note.dim{color:var(--dim)}
#controls{flex:1 1 420px;max-width:560px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:stretch}
.dial{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}
.dial output{text-align:center;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap;overflow:hidden}
.dial output b{display:block;color:var(--ink);font-weight:500;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;min-height:44px;min-width:44px;border-radius:10px}
button:focus-visible,a:focus-visible{outline:2px solid var(--new);outline-offset:2px}
.dial button{font-family:var(--mono);font-size:20px;color:var(--ink)}
.dial button:active{background:#1c1c1c}
#go{background:var(--sun);color:#111;font-weight:600;font-size:16px;padding:0 26px;letter-spacing:.01em}
#go:active{transform:translateY(1px)}
#go.flying{background:none;color:var(--ink);border:1px solid var(--line)}
nav{display:flex;flex-wrap:wrap;gap:0 2px;align-items:center}
nav button,nav a{font-size:14px;color:var(--dim);padding:0 12px;min-height:44px;display:inline-flex;align-items:center;text-decoration:none;border-radius:10px}
nav button:hover,nav a:hover{color:var(--ink)}
#won{position:fixed;z-index:3;left:var(--fx,0);width:var(--fw,100%);top:calc(var(--fy,0px) + var(--fh,100%));transform:translateY(-100%);padding:44px 16px 16px;display:none;gap:12px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(to top,rgba(0,0,0,.94) calc(100% - 44px),rgba(0,0,0,0))}
#won.on{display:flex}
#won p{font-size:17px;font-weight:600;margin-right:auto}
#won p span{display:block;font-size:14px;font-weight:400;color:var(--dim);margin-top:2px}
#won button{border:1px solid var(--line);padding:0 18px;font-size:15px;background:#000}
#won #more{flex-basis:100%;font-size:13px;color:var(--dim);text-decoration:none;min-height:32px;display:flex;align-items:center}
#won #more:hover{color:var(--ink)}
#won #next{background:var(--ink);color:#000;border-color:var(--ink);font-weight:600}
dialog{margin:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{font-size:17px;font-weight:600}
dialog .sub{color:var(--dim);font-size:14px;margin:4px 0 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
#grid button{font-family:var(--mono);font-size:13px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
#grid button.done{background:#1a1a1a;color:var(--ink)}
#grid button.here{border-color:var(--sun);color:var(--sun)}
#grid button:disabled{color:#3a3a3a;border-color:#161616;cursor:default}
dialog .row{display:flex;justify-content:flex-end;margin-top:16px}
dialog .row button{border:1px solid var(--line);padding:0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (max-width:520px){
  #ui{gap:6px}
  #note{flex-basis:100%;font-size:15px}
  #controls{flex-basis:100%;max-width:none;grid-template-columns:1fr 1fr}
  #go{grid-column:1/-1;min-height:52px}
  nav{width:100%;justify-content:space-between}
  header{gap:10px}
  h1{font-size:13px;letter-spacing:.18em}
}
/* A phone on its side: the field takes the full height, the controls sit in a strip on the right. */
@media (orientation:landscape) and (max-height:520px){
  #ui{left:auto;top:0;width:clamp(230px,calc(100vw - 100dvh * 1.44),340px);flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:center;gap:8px;overflow-y:auto;
    padding:34px max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) 12px;background:linear-gradient(to left,rgba(5,5,5,.96) 80%,rgba(5,5,5,0))}
  #note{flex:0 0 auto;font-size:14px;min-height:3.4em}
  #controls{flex:0 0 auto;max-width:none;grid-template-columns:1fr}
  #go{min-height:48px}
  nav{justify-content:space-between}
  nav button,nav a{padding:0 5px;font-size:13px}
  header{right:clamp(230px,calc(100vw - 100dvh * 1.44),340px)}
}
</style>
</head>
<body>
<main>
  <header id="top">
    <h1>New Earth</h1>
    <p class="hud" id="lvl">Level <b>1</b> of 100</p>
    <p class="hud" id="tries">Tries <b>0</b></p>
  </header>
  <div id="stage">
    <canvas id="cv" tabindex="0" role="img" aria-label="The playing field. Old Earth at one end, New Earth at the other, moons, planets and suns between them."></canvas>
    <div id="won" role="group" aria-label="Level complete">
      <p id="wonText"></p>
      <button id="share" type="button">Share</button>
      <button id="next" type="button">Next level</button>
      <a id="more" href="https://bananaintelligence.ai/?ct=newearth" target="_blank" rel="noopener">More from Banana Intelligence</a>
    </div>
  </div>
  <div id="ui">
  <p id="note" role="status" aria-live="polite"></p>
  <div id="controls">
    <div class="dial" role="group" aria-label="Aim angle">
      <button type="button" data-da="-0.5" aria-label="Aim lower, half a degree">&minus;</button>
      <output id="angOut">Angle<b>0&deg;</b></output>
      <button type="button" data-da="0.5" aria-label="Aim higher, half a degree">+</button>
    </div>
    <div class="dial" role="group" aria-label="Launch power">
      <button type="button" data-dp="-1" aria-label="Less power">&minus;</button>
      <output id="powOut">Power<b>0%</b></output>
      <button type="button" data-dp="1" aria-label="More power">+</button>
    </div>
    <button id="go" type="button">Launch</button>
  </div>
  <nav aria-label="Game">
    <button id="levelsBtn" type="button">Levels</button>
    <button id="snd" type="button" aria-pressed="true">Sound on</button>
    <button id="full" type="button" hidden>Full screen</button>
    <a href="/classic/">Classic</a>
  </nav>
  </div>
  <p class="sr" id="aimRead" aria-live="polite"></p>
</main>

<dialog id="levels" aria-labelledby="lvTitle">
  <h2 id="lvTitle">Levels</h2>
  <p class="sub" id="lvSub"></p>
  <div id="grid"></div>
  <div class="row"><button type="button" id="lvClose">Close</button></div>
</dialog>

<script src="sim.js"></script>
<script src="levels.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const KEY = 'newearth.sling.v1', SITE = 'https://new-earth-omega.vercel.app/';
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const SPEED = 1.2, PULL = 2.2;           // flight plays a little faster than real time; pull distance to launch speed
const TOTAL = LEVELS.length;

// ---- saved progress: this browser only ----
let save = { reached: 1, best: {} };
try { Object.assign(save, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch {} };
let muted = false; try { muted = localStorage.getItem('newearth.muted') === '1'; } catch {}
window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
const track = name => { try { window.va('event', { name }); } catch {} };
// Count which link brought the visit (?ct=ig counts as "from-ig"). A plain count, nothing about the person.
{ const ct = new URLSearchParams(location.search).get('ct'); if (ct && /^[a-z0-9-]{1,24}$/.test(ct)) track('from-' + ct); }

// ---- sound ----
let ac = null;
function tone(f, d, type = 'sine', g = .06, slide = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), v = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(v).connect(ac.destination); o.start(t); o.stop(t + d);
  } catch {}
}
const sfx = {
  launch: () => tone(180, .35, 'triangle', .08, 420),
  crash: () => tone(140, .3, 'sawtooth', .07, -100),
  lost: () => tone(300, .4, 'sine', .05, -200),
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .28, 'triangle', .07), i * 90)),
};

// ---- level state ----
let n = 1, L, ang = 0, pow = 100, tries = 0, mode = 'aim';   // aim | fly | wait | won
let S = null, trail = [], ghost = [], mark = null, drag = null, raf = 0, last = 0, acc = 0, launched = false;
const aims = {};
const INTRO = {
  1: 'Reach New Earth. A world sits in the way, so no straight shot works. Pull the rocket back, let go, and let gravity bend it around.',
  2: 'Aim to one side of the world in the way. Its pull swings you around it. Suns pull hardest, then planets, then moons.',
  6: 'Two worlds now. Each one pulls.',
  11: 'More worlds, more pull.',
  16: 'Asteroids now. They do not pull, but hitting one ends the flight.',
  26: 'Some planets move now. They start when you launch.',
  36: 'A satellite circles one of the worlds. It starts moving when you launch.',
  46: 'Four worlds and a smaller target.',
  56: 'A probe is loose out here. Do not hit it.',
  86: 'Everything at once.',
  100: 'A black hole sits in the way. Last one.',
};
const HOW = matchMedia('(pointer: coarse)').matches
  ? 'Pull back anywhere on the screen and let go. Fine tune with the buttons.'
  : 'Drag back and let go, or use the arrow keys and Space.';
const NAME = { earth: 'Earth', moon: 'a moon', planet: 'a planet', sun: 'a sun', hole: 'the black hole', asteroid: 'an asteroid', sat: 'a satellite', probe: 'the probe' };

function setNote(text, dim) { const el = $('note'); el.textContent = text; el.classList.toggle('dim', !!dim); }
function hud() {
  $('lvl').innerHTML = `Level <b>${n}</b> of ${TOTAL}`;
  $('tries').innerHTML = `Tries <b>${tries}</b>`;
  $('angOut').innerHTML = `Angle<b>${(Math.round(ang * 2) / 2).toFixed(1)}&deg;</b>`;
  $('powOut').innerHTML = `Power<b>${Math.round(pow / PMAX * 100)}%</b>`;
  const go = $('go'); go.textContent = mode === 'fly' ? 'Reset' : mode === 'won' ? (n === TOTAL ? 'Play again' : 'Next level') : 'Launch'; go.classList.toggle('flying', mode === 'fly');
}
let readT = 0;
function readAim() {
  clearTimeout(readT);
  readT = setTimeout(() => { $('aimRead').textContent = `Aim angle ${Math.round(ang)} degrees, power ${Math.round(pow / PMAX * 100)} percent.`; }, 350);
}
function setAim(a, p, quiet) {
  ang = ((a + 180) % 360 + 360) % 360 - 180;
  pow = Math.min(PMAX, Math.max(PMIN, p));
  aims[n] = [ang, pow]; hud(); draw(); if (!quiet) readAim();
}

function load(k) {
  cancelAnimationFrame(raf);
  n = Math.min(TOTAL, Math.max(1, k)); L = LEVELS[n - 1];
  [ang, pow] = aims[n] || L.aim; tries = 0; mode = 'aim'; S = null; trail = []; ghost = []; mark = null; drag = null;
  stars = makeStars(n);
  $('won').classList.remove('on');
  setNote(INTRO[n] || HOW, !INTRO[n]);
  try { history.replaceState(null, '', n > 1 ? '?level=' + n : location.pathname); } catch {}
  hud(); draw();
}

function launch() {
  if (mode !== 'aim') return;
  if (!launched) { launched = true; track('launch'); }
  tries++; mode = 'fly'; S = newShot(L, ang, pow); trail = []; mark = null;
  setNote('Rocket away.', true); sfx.launch(); hud();
  if (reduced.matches) {
    let r = null;
    while (!r) { r = step(L, S); if (S.n % 3 === 0) trail.push(S.x, S.y); }
    finish(r);
  } else { last = performance.now(); acc = 0; raf = requestAnimationFrame(tick); }
}
function tick(now) {
  acc += Math.min(.05, (now - last) / 1000) * SPEED; last = now;
  let r = null;
  while (acc >= STEP && !r) { r = step(L, S); acc -= STEP; if (S.n % 3 === 0) trail.push(S.x, S.y); }
  draw();
  if (r) finish(r); else raf = requestAnimationFrame(tick);
}
function finish(r) {
  cancelAnimationFrame(raf);
  if (r === 'win') {
    mode = 'won'; sfx.win();
    const first = !save.best[n];
    save.best[n] = Math.min(save.best[n] || 1e9, tries);
    save.reached = Math.min(TOTAL, Math.max(save.reached, n + 1)); persist();
    const t = tries === 1 ? 'first try' : tries + ' tries';
    if (n === TOTAL) {
      const all = Object.values(save.best).reduce((a, b) => a + b, 0);
      $('wonText').innerHTML = `You reached New Earth.<span>All ${TOTAL} levels, ${all} launches in total.</span>`;
      $('next').textContent = 'Play again';
      if (first) track('finish');
    } else {
      $('wonText').innerHTML = `Level ${n} done, ${t}.<span>${save.best[n] < tries ? 'Your best is ' + save.best[n] + '.' : 'New Earth, reached.'}</span>`;
      $('next').textContent = 'Next level';
    }
    setNote(`You reached New Earth in ${tries === 1 ? '1 try' : tries + ' tries'}.`);
    $('won').classList.add('on'); hud(); draw();
    if (first) track('win');
    $('next').focus({ preventScroll: true });
    return;
  }
  const why = r === 'crash' ? `hit ${NAME[S.hit] || 'something'}` : r === 'lost' ? 'flew off into space' : r === 'late' ? 'ran out of fuel' : 'called back';
  if (r === 'crash') sfx.crash(); else if (r !== 'abort') sfx.lost();
  mark = r === 'crash' ? { x: S.x, y: S.y } : null; ghost = trail; trail = [];
  setNote(`Try ${tries}: ${why}. ${r === 'crash' ? 'Try another angle.' : r === 'lost' ? 'Less power, or lean on a planet.' : 'Try again.'}`);
  mode = 'wait'; hud(); draw();
  setTimeout(() => { if (mode !== 'wait') return; mode = 'aim'; S = null; hud(); draw(); }, reduced.matches || r === 'abort' ? 0 : 650);
}

// ---- drawing ----
let stars = [];
function makeStars(seed) {
  let a = seed * 2654435761 >>> 0; const R = () => (a = a * 1664525 + 1013904223 >>> 0) / 4294967296;
  return Array.from({ length: 160 }, () => [R(), R(), R() < .15 ? .9 : .5, .25 + R() * .45]);
}
// The canvas covers the whole screen. The 360 x 250 field is drawn as large as fits in the space
// the header and controls leave free. view = that placement in CSS pixels: scale k, offset ox, oy.
// On an upright screen (p) the field turns a quarter turn so the rocket flies up: field x runs up, field y runs right.
let view = { k: 1, ox: 0, oy: 0, p: false };
function fit() {
  const vw = innerWidth, vh = innerHeight, d = Math.min(3, window.devicePixelRatio || 1);
  const w = Math.round(vw * d), h = Math.round(vh * d);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const ui = $('ui').getBoundingClientRect(), hd = $('top').getBoundingClientRect(), side = ui.top < vh / 3;
  const left = Math.max(8, document.querySelector('h1').getBoundingClientRect().left - 8);
  const top = hd.bottom, right = (side ? ui.left : vw - left + 8) - 8, bottom = (side ? vh : ui.top) - 8;
  const p = vh > vw, sw = p ? H : W, sh = p ? W : H;
  const k = Math.max(.2, Math.min((right - left) / sw, (bottom - top) / sh));
  view = { k, p, ox: left + (right - left - k * sw) / 2, oy: top + (bottom - top - k * sh) / 2 };
  const st = document.documentElement.style;
  st.setProperty('--fx', view.ox + 'px'); st.setProperty('--fy', view.oy + 'px'); st.setProperty('--fw', k * sw + 'px'); st.setProperty('--fh', k * sh + 'px');
  draw();
}
function dots(pts, alpha, r) {
  ctx.fillStyle = `rgba(242,242,242,${alpha})`;
  for (let i = 0; i < pts.length; i += 2) { ctx.beginPath(); ctx.arc(pts[i], pts[i + 1], r, 0, 7); ctx.fill(); }
}
function body(b, p) {
  const { x, y } = p, r = b.r;
  if (b.type === 'sun') {
    const g = ctx.createRadialGradient(x, y, r * .6, x, y, r * 2.1);
    g.addColorStop(0, 'rgba(255,210,63,.38)'); g.addColorStop(1, 'rgba(255,210,63,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.1, 0, 7); ctx.fill();
    ctx.fillStyle = '#FFD23F'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  } else if (b.type === 'earth') {
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip();
    ctx.fillStyle = '#2B66C9'; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    ctx.fillStyle = '#3FA765';
    for (const [dx, dy, rr] of [[-.35, -.3, .42], [.4, .15, .36], [-.1, .6, .3]]) { ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, rr * r, 0, 7); ctx.fill(); }
    ctx.restore();
  } else if (b.type === 'hole') {
    const g = ctx.createRadialGradient(x, y, r, x, y, r * 3.2);
    g.addColorStop(0, 'rgba(242,242,242,.5)'); g.addColorStop(.25, 'rgba(242,242,242,.12)'); g.addColorStop(1, 'rgba(242,242,242,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 1.2; ctx.stroke();
  } else if (b.type === 'planet') {
    ctx.fillStyle = '#141414'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip();
    ctx.strokeStyle = 'rgba(242,242,242,.45)'; ctx.lineWidth = 1;
    for (const k of [-.35, .1, .5]) { ctx.beginPath(); ctx.moveTo(x - r, y + k * r); ctx.quadraticCurveTo(x, y + k * r + r * .22, x + r, y + k * r); ctx.stroke(); }
    ctx.restore();
  } else if (b.type === 'asteroid') {
    // a lumpy rock: no pull, but solid
    ctx.fillStyle = '#6b6b6b'; ctx.strokeStyle = '#cfcfcf'; ctx.lineWidth = .8; ctx.beginPath();
    for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2, rr = r * (.78 + .3 * Math.abs(Math.sin(i * 2.7 + b.x))); ctx[i ? 'lineTo' : 'moveTo'](x + rr * Math.cos(a), y + rr * Math.sin(a)); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4a4a4a'; ctx.beginPath(); ctx.arc(x - r * .25, y - r * .15, r * .22, 0, 7); ctx.fill();
  } else if (b.type === 'sat') {
    // a satellite: box with two solar panels, turned along its orbit
    ctx.save(); ctx.translate(x, y); if (b.o) ctx.rotate(Math.atan2(y - b.o.cy, x - b.o.cx));
    ctx.fillStyle = '#6FA8FF'; ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = .6;
    for (const k of [-1, 1]) { ctx.fillRect(-r * .35, k * r * .45 - (k < 0 ? r * .75 : 0), r * .7, r * .75); ctx.strokeRect(-r * .35, k * r * .45 - (k < 0 ? r * .75 : 0), r * .7, r * .75); }
    ctx.fillStyle = '#f2f2f2'; ctx.fillRect(-r * .45, -r * .45, r * .9, r * .9);
    ctx.strokeStyle = '#f2f2f2'; ctx.beginPath(); ctx.moveTo(-r * .45, 0); ctx.lineTo(-r * .95, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(-r, 0, r * .22, Math.PI * .5, Math.PI * 1.5); ctx.stroke();
    ctx.restore();
  } else if (b.type === 'probe') {
    const u = r / 21, AMBER = '#f2a33a', DARK = '#14181d', CYAN = '#5fe1ff', GREY = '#aab3bd';
    ctx.save(); ctx.translate(x, y + 1); ctx.rotate(.3); ctx.scale(u, u); ctx.lineWidth = 1; ctx.strokeStyle = '#0a0a0a';
    ctx.strokeStyle = GREY; ctx.lineWidth = 2;
    for (const [sx, sy, ex, ey] of [[-5, 10, -11, 22], [0, 14, 0, 24], [5, 10, 11, 22]]) { ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke(); }
    ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(1, -13); ctx.lineTo(5, -22); ctx.stroke();
    ctx.fillStyle = '#e23b3b'; ctx.beginPath(); ctx.arc(5, -22, 1.7, 0, 7); ctx.fill(); ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = AMBER; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(9, -8); ctx.lineTo(9, 9); ctx.lineTo(0, 15); ctx.lineTo(-9, 9); ctx.lineTo(-9, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.clip(); ctx.fillStyle = GREY; ctx.fillRect(-9, 4, 18, 3); ctx.restore();
    ctx.fillStyle = DARK; ctx.beginPath(); ctx.arc(0, -5, 5.5, 0, 7); ctx.fill();
    ctx.fillStyle = CYAN; ctx.beginPath(); ctx.arc(-1.7, -7, 1.25, 0, 7); ctx.fill();
    ctx.restore();
  } else {
    ctx.fillStyle = '#a3a3a3'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#7c7c7c';
    for (const [dx, dy, rr] of [[-.3, -.25, .26], [.35, .2, .2], [-.1, .5, .14]]) { ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, rr * r, 0, 7); ctx.fill(); }
  }
}
function rocket(x, y, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-a * RAD);
  ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-5, 4.2); ctx.lineTo(-2.6, 0); ctx.lineTo(-5, -4.2); ctx.closePath();
  ctx.fillStyle = '#f2f2f2'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = .8; ctx.stroke();
  ctx.restore();
}
function draw() {
  if (!L || !cv.width) return;
  const d = cv.width / innerWidth, k = view.k * d;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  for (const [x, y, r, a] of stars) { ctx.fillStyle = `rgba(242,242,242,${a})`; ctx.fillRect(x * cv.width, y * cv.height, r * k, r * k); }
  if (view.p) ctx.setTransform(0, -k, k, 0, view.ox * d, (view.oy + view.k * W) * d);
  else ctx.setTransform(k, 0, 0, k, view.ox * d, view.oy * d);
  // the edge of the field: a rocket that crosses it is lost
  ctx.strokeStyle = 'rgba(242,242,242,.12)'; ctx.lineWidth = .6; ctx.setLineDash([2, 5]); ctx.strokeRect(-OUT, -OUT, W + 2 * OUT, H + 2 * OUT); ctx.setLineDash([]);
  const t = S && mode !== 'wait' ? S.n * STEP : 0;
  // paths of the movers
  ctx.setLineDash([1.5, 4]); ctx.strokeStyle = 'rgba(242,242,242,.28)'; ctx.lineWidth = .8;
  for (const b of L.b) if (b.o) { ctx.beginPath(); ctx.arc(b.o.cx, b.o.cy, b.o.r, 0, 7); ctx.stroke(); }
  ctx.setLineDash([]);
  if (ghost.length) dots(ghost, .2, .9);
  if (trail.length) dots(trail, .75, 1.1);
  // New Earth
  const T = L.t;
  ctx.setLineDash([2, 3]); ctx.strokeStyle = 'rgba(111,168,255,.55)'; ctx.lineWidth = .8;
  ctx.beginPath(); ctx.arc(T.x, T.y, T.r + 3.5, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  ctx.save(); ctx.beginPath(); ctx.arc(T.x, T.y, T.r, 0, 7); ctx.clip();
  ctx.fillStyle = '#6FA8FF'; ctx.fillRect(T.x - T.r, T.y - T.r, 2 * T.r, 2 * T.r);
  ctx.fillStyle = '#BFE3C8';
  for (const [dx, dy, rr] of [[.3, -.35, .4], [-.45, .25, .34], [.25, .55, .22]]) { ctx.beginPath(); ctx.arc(T.x + dx * T.r, T.y + dy * T.r, rr * T.r, 0, 7); ctx.fill(); }
  ctx.restore();
  ctx.font = '600 7px ' + getComputedStyle(document.documentElement).getPropertyValue('--mono');
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(111,168,255,.95)';
  if (view.p) { // keep the label upright: undo the quarter turn at the planet
    ctx.save(); ctx.translate(T.x, Math.min(H - 26, Math.max(26, T.y))); ctx.rotate(Math.PI / 2);
    ctx.fillText('NEW EARTH', 0, T.x - T.r - 13 < 3 ? -T.r - 8 : T.r + 13); ctx.restore();
  } else {
    const ly = T.y + T.r + 13 > H - 3 ? T.y - T.r - 8 : T.y + T.r + 13;
    ctx.fillText('NEW EARTH', Math.min(W - 26, Math.max(26, T.x)), ly);
  }
  for (const b of L.b) body(b, bodyAt(b, t));
  if (mark) {
    ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.moveTo(mark.x - 4, mark.y - 4); ctx.lineTo(mark.x + 4, mark.y + 4); ctx.moveTo(mark.x + 4, mark.y - 4); ctx.lineTo(mark.x - 4, mark.y + 4); ctx.stroke();
  }
  if (mode === 'aim') {
    const c = Math.cos(ang * RAD), s = -Math.sin(ang * RAD);
    // short dotted preview: where the rocket starts off, not where gravity takes it
    ctx.fillStyle = 'rgba(242,242,242,.9)';
    const len = pow * .55;
    for (let d = 10; d <= len; d += 6) { ctx.beginPath(); ctx.arc(L.s.x + c * d, L.s.y + s * d, 1, 0, 7); ctx.fill(); }
    if (drag && drag.live) {
      const pl = pow / PULL;
      ctx.strokeStyle = 'rgba(255,210,63,.9)'; ctx.lineWidth = 1.2; ctx.beginPath();
      ctx.moveTo(L.s.x, L.s.y); ctx.lineTo(L.s.x - c * pl, L.s.y - s * pl); ctx.stroke();
      ctx.beginPath(); ctx.arc(L.s.x - c * pl, L.s.y - s * pl, 2.4, 0, 7); ctx.fillStyle = '#FFD23F'; ctx.fill();
    }
    rocket(L.s.x, L.s.y, ang);
  } else if (S && (mode === 'fly' || mode === 'won')) {
    rocket(S.x, S.y, Math.atan2(-S.vy, S.vx) / RAD);
  }
}

// ---- aiming by pointer ----
function at(e) {
  const u = (e.clientX - view.ox) / view.k, v = (e.clientY - view.oy) / view.k;
  return view.p ? { x: W - v, y: u, k: view.k } : { x: u, y: v, k: view.k };
}
function nearRocket(e) { const p = at(e); return Math.hypot(p.x - L.s.x, p.y - L.s.y) * p.k <= 48; }
// The page does not scroll, so a finger can pull back from anywhere on the field.
cv.addEventListener('touchstart', e => { if (mode === 'aim') e.preventDefault(); }, { passive: false });
cv.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });
cv.addEventListener('pointerdown', e => {
  if (mode !== 'aim' || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const near = nearRocket(e);
  const p = at(e);
  drag = { id: e.pointerId, ox: near ? L.s.x : p.x, oy: near ? L.s.y : p.y, live: false, a0: ang, p0: pow };
  try { cv.setPointerCapture(e.pointerId); } catch {}
  setNote('Pull back, then let go.', true);
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = at(e), dx = drag.ox - p.x, dy = drag.oy - p.y, d = Math.hypot(dx, dy);
  if (d < 4) return;
  drag.live = d * PULL >= PMIN;
  setAim(Math.atan2(-dy, dx) / RAD, d * PULL);
  if (drag.live) setNote('Let go to launch.', true);
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (cancel) { setAim(d.a0, d.p0, true); setNote(HOW, true); return; }
  if (d.live) launch(); else { setAim(d.a0, d.p0, true); setNote('Pull farther back to launch.'); }
}
cv.addEventListener('pointerup', e => endDrag(e, false));
cv.addEventListener('pointercancel', e => endDrag(e, true));

// ---- buttons and keys ----
// Nudges land on the half degree and the whole power point, the same grid the solver checks.
function nudge(da, dp) { if (mode === 'aim') setAim(da ? Math.round((ang + da) * 2) / 2 : ang, dp ? Math.round(pow + dp) : pow); }
document.querySelectorAll('[data-da],[data-dp]').forEach(b => {
  const da = +(b.dataset.da || 0), dp = +(b.dataset.dp || 0);
  let hold = 0, rep = 0;
  const stop = () => { clearTimeout(hold); clearInterval(rep); };
  b.addEventListener('pointerdown', () => { stop(); hold = setTimeout(() => { rep = setInterval(() => nudge(da * 2, dp * 2), 60); }, 380); });
  ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach(ev => b.addEventListener(ev, stop));
  b.addEventListener('click', () => nudge(da, dp));
});
$('go').addEventListener('click', () => { if (mode === 'fly') finish('abort'); else if (mode === 'won') $('next').click(); else launch(); });
$('next').addEventListener('click', () => load(n === TOTAL ? 1 : n + 1));
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || $('levels').open) return;
  const onBtn = e.target.closest && e.target.closest('button,a');
  const big = e.shiftKey ? 5 : 1;
  switch (e.key) {
    case 'ArrowUp': nudge(.5 * big, 0); break;
    case 'ArrowDown': nudge(-.5 * big, 0); break;
    case 'ArrowRight': nudge(0, big); break;
    case 'ArrowLeft': nudge(0, -big); break;
    case ' ': case 'Enter':
      if (onBtn) return;
      if (mode === 'aim') launch(); else if (mode === 'won') $('next').click(); else return; break;
    case 'r': case 'R': if (mode === 'fly') finish('abort'); else return; break;
    default: return;
  }
  e.preventDefault();
});

// ---- sound toggle ----
function setMuted(m) {
  muted = m; try { localStorage.setItem('newearth.muted', m ? '1' : '0'); } catch {}
  $('snd').textContent = m ? 'Sound off' : 'Sound on'; $('snd').setAttribute('aria-pressed', String(!m));
}
$('snd').addEventListener('click', () => { setMuted(!muted); if (!muted) tone(660, .12, 'triangle'); });
setMuted(muted);

// ---- level select: only levels already reached ----
function openLevels() {
  const g = $('grid'); g.textContent = '';
  const done = Object.keys(save.best).length;
  $('lvSub').textContent = done ? `${done} of ${TOTAL} done. Saved on this device only.` : 'Finish a level to open the next one. Saved on this device only.';
  for (let i = 1; i <= TOTAL; i++) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = i;
    const open = i <= save.reached;
    b.disabled = !open; if (save.best[i]) b.classList.add('done'); if (i === n) b.classList.add('here');
    b.setAttribute('aria-label', `Level ${i}` + (save.best[i] ? `, done in ${save.best[i]} ${save.best[i] === 1 ? 'try' : 'tries'}` : open ? '' : ', locked') + (i === n ? ', current' : ''));
    if (open) b.addEventListener('click', () => { $('levels').close(); load(i); });
    g.appendChild(b);
  }
  $('levels').showModal();
  const here = g.querySelector('.here'); if (here) here.focus();
}
$('levelsBtn').addEventListener('click', openLevels);
$('lvClose').addEventListener('click', () => $('levels').close());
$('levels').addEventListener('click', e => { if (e.target === $('levels')) $('levels').close(); });

// ---- share ----
$('share').addEventListener('click', async () => {
  const t = tries === 1 ? 'on the first try' : `in ${tries} tries`;
  const text = n === TOTAL ? `I reached New Earth. All ${TOTAL} levels, one launch each.` : `New Earth, level ${n} of ${TOTAL} ${t}. One launch, no steering.`;
  const url = SITE + '?ct=x-share';
  track('share');
  try {
    if (navigator.share && matchMedia('(pointer: coarse)').matches) { await navigator.share({ text, url }); return; }
    await navigator.clipboard.writeText(text + ' ' + url);
    $('share').textContent = 'Copied'; setTimeout(() => { $('share').textContent = 'Share'; }, 1600);
  } catch {}
});

// ---- start ----
new ResizeObserver(fit).observe($('ui'));
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));
// Full screen button, where the browser allows it (not iPhone Safari).
const fsEl = document.documentElement;
if (document.fullscreenEnabled && fsEl.requestFullscreen) {
  $('full').hidden = false;
  $('full').addEventListener('click', () => { document.fullscreenElement ? document.exitFullscreen() : fsEl.requestFullscreen().catch(() => {}); });
  document.addEventListener('fullscreenchange', () => { $('full').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; fit(); });
}
const want = +new URLSearchParams(location.search).get('level');
load(want >= 1 && want <= save.reached ? want : save.reached);
fit();
window.__game = { get state() { return { n, ang, pow, tries, mode, reached: save.reached }; }, load, launch, setAim };
})();
</script>
