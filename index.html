<style>
:root{--bg:#050505;--ink:#f2f2f2;--dim:#7d7d7d;--line:#262626;--accent:#6fa8ff;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--sans);
  -webkit-font-smoothing:antialiased;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
::selection{background:var(--ink);color:var(--bg)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top)) 18px 0;display:grid;
  grid-template-columns:1fr auto 1fr;align-items:start;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  color:var(--dim);pointer-events:none;text-transform:uppercase;transition:opacity .4s}
#hud.off{opacity:0}
#lives{display:flex;gap:7px;align-items:center;height:16px}
#lives svg{width:11px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.4}
#lives svg.spent{stroke:var(--line)}
#clock{font-size:26px;letter-spacing:.02em;color:var(--ink);font-variant-numeric:tabular-nums;text-align:center;line-height:1}
#sub{margin-top:9px;text-align:center;min-height:14px;line-height:1.7;white-space:nowrap;color:var(--ink);opacity:0;transition:opacity .3s}
#sub.on{opacity:1}
#count{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#count b{color:var(--ink);font-weight:500}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(5,5,5,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .35s}
#overlay.off{opacity:0;pointer-events:none}
.card{width:100%;max-width:400px;text-align:center}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
h1{font-size:clamp(44px,11vw,68px);font-weight:600;letter-spacing:-.045em;line-height:1.02;margin:14px 0 14px}
h1.time{font-family:var(--mono);font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
p.lead{color:var(--dim);font-size:16px;line-height:1.55;max-width:320px;margin:0 auto}
button.go{margin-top:28px;height:52px;padding:0 34px;border-radius:26px;border:0;background:var(--ink);color:var(--bg);
  font:600 16px var(--sans);letter-spacing:-.01em;cursor:pointer;transition:transform .15s}
button.go:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.share{display:block;margin:14px auto 0;height:44px;padding:0 22px;border-radius:22px;border:1px solid #3a3a3a;background:none;color:var(--ink);font:500 14px var(--sans);cursor:pointer}
.share:active{background:rgba(255,255,255,.08)}
.keys{margin-top:16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim);line-height:1.8}
.times{margin:30px auto 0;max-width:260px;border-top:1px solid var(--line);padding-top:16px;font-family:var(--mono);font-size:12px}

.entry input{width:104px;height:52px;border-radius:12px;border:1px solid var(--line);background:#0c0c0c;color:var(--ink);
  font:500 22px var(--mono);letter-spacing:.3em;text-align:center;text-transform:uppercase;padding-left:.3em;-webkit-user-select:text;user-select:text}
.entry button.go{margin-top:0}
#brake{position:fixed;right:calc(22px + env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));width:84px;height:84px;
  border-radius:50%;border:1px solid #555;background:rgba(255,255,255,.04);color:var(--ink);font:500 11px var(--mono);
  letter-spacing:.16em;display:none}
#snd{position:fixed;z-index:5;top:calc(34px + env(safe-area-inset-top));right:8px;height:44px;padding:0 10px;border:0;background:none;color:var(--dim);font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}

#brake.down{background:rgba(255,255,255,.18)}
@media (pointer:coarse){#brake.show{display:block}.keys .kb{display:none}}
@media (pointer:fine){.keys .tc{display:none}}

<body>
<canvas id="c" aria-label="New Earth game"></canvas>
<div id="hud" class="off">
  <div id="lives"></div>
  <div><div id="clock">0:00.00</div><div id="sub"></div></div>
  <div id="count"><b>000</b> / 100</div>
</div>
<button id="snd" aria-pressed="true">Sound <b>on</b></button>
<button id="brake" aria-label="Brake">BRAKE</button>
<div id="overlay"><div class="card" id="card"><div class="eyebrow">100 bodies &middot; 3 ships</div><h1>New Earth</h1><p class="lead">Fly from Earth to New Earth. Get past 100 moons, planets, suns and one black hole. A new course every day. Beat the robot.</p></div></div>
<script>
/*SIM-START*/
const W=900,THRUST=260,BRAKE=220,TURN=3.4,VMAX=620,SHIP_R=8,RANGE=900;
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wrapX=x=>((x%W)+W)%W;
function wdx(a,b){let d=(b-a)%W;if(d>W/2)d-=W;else if(d<-W/2)d+=W;return d}
function wrapA(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a}
const TYPES={moon:{r:[16,28],gs:90},planet:{r:[36,60],gs:190},giant:{r:[70,95],gs:290},star:{r:[105,135],gs:420}};

function makeLevel(seed){
  const R=rng(seed||11);
  const bodies=[{type:'earth',x:450,y:0,R:120,gs:90,infl:420,n:0,sats:[],seed:.37}];
  const rows=[],asteroids=[],callouts=[],did={};
  let n=0,y=0,prevR=120;
  const mk=(type,x,r)=>{const T=TYPES[type];r=r||lerp(T.r[0],T.r[1],R());
    return{type,x:wrapX(x),y:0,R:r,gs:T.gs,infl:clamp(r*5.5,240,600),n:0,sats:[],seed:R()}};
  const pick=d=>{const w={moon:1-d,planet:.3+d*.6,giant:Math.max(0,d-.1)*1.2,star:Math.max(0,d-.2)*1.2};
    let tot=0;for(const k in w)tot+=w[k];let u=R()*tot;for(const k in w){u-=w[k];if(u<=0)return k}return'planet'};
  while(n<99){
    const d=n/99,left=99-n;let row,wide=1,say=null;
    if(n===0)row=[mk('moon',650,22)];
    else if(n>=17&&!did.star){did.star=1;row=[mk('star',R()*W,110)];wide=1.3;say='First sun ahead'}
    else if(n>=39&&!did.bin){did.bin=1;const x=R()*W;row=[mk('star',x,112),mk('star',x+450,112)];wide=1.7;say='Twin suns ahead'}
    else if(n>=59&&!did.tri){did.tri=1;const x=R()*W;row=[mk('star',x,60),mk('star',x+300,60),mk('star',x+600,60)];wide=1.8;say='Three suns ahead'}
    else if(n>=79&&!did.bin2){did.bin2=1;const x=R()*W;row=[mk('star',x,112),mk('star',x+450,112)];wide=1.7;say='Twin suns ahead'}
    else if(n>=97&&!did.fin&&left>=2){did.fin=1;const x=R()*W;row=[mk('star',x,105),mk('star',x+450,105)];wide=2;say='Last suns ahead'}
    else if(n>62&&left>=5&&R()<.18){const x=R()*W,r=38+R()*10;row=[mk('planet',x,r),mk('planet',x+300,r),mk('planet',x+600,r)];wide=1.5;say='Three planets ahead'}
    else if(n>12&&left>=5&&R()<.08+.5*d){
      const minGap=lerp(190,115,d);let a,b,t=0;
      do{a=mk(pick(d),0);b=mk(pick(d),0);t++}while(410-a.R-b.R<minGap&&t<20);
      if(410-a.R-b.R<minGap){a=mk('planet',0,44);b=mk('planet',0,44)}
      const x=R()*W;a.x=wrapX(x);b.x=wrapX(x+450+(R()-.5)*80);row=[a,b];wide=1.35}
    else{const b=mk(pick(d),R()*W);
      if(n>10&&(b.type==='planet'||b.type==='giant')&&R()<.3)
        b.sats.push({r:b.R+34+R()*28,a0:R()*6.283,w:(R()<.5?-1:1)*(.7+R()*.6),rad:6,kind:'sat'});
      row=[b]}
    const rowR=Math.max(...row.map(b=>b.R));
    const gapY=lerp(340,175,d)*(.85+.3*R())*wide,top=y+prevR;
    y=top+gapY+rowR;
    row.forEach(b=>{b.y=y;b.n=++n;bodies.push(b)});
    rows.push({y,mid:top+gapY/2});if(say)callouts.push({y:top-120,text:say});
    if(n>4&&R()<(d<.65?.18+.45*d:.08))asteroids.push({x0:R()*W,y:top+gapY/2+(R()-.5)*gapY*.3,vx:(R()<.5?-1:1)*(50+R()*(80+90*d)),R:8+R()*9,seed:R()});
    prevR=rowR;
  }
  const top=y+prevR;y=top+600+34;
  const hole={type:'hole',x:450,y,R:34,gs:14e6/(34*34),infl:900,n:100,sats:[],seed:.5};
  for(let i=0;i<3;i++)hole.sats.push({r:400,a0:i*Math.PI*2/3,w:.3,rad:10,kind:'rock',seed:R()});
  callouts.push({y:hole.y-1000,text:'Black hole ahead'},{y:hole.y+260,text:'New Earth ahead'});
  bodies.push(hole);rows.push({y,mid:top+300});
  const home={type:'newearth',x:450,y:y+720,R:110,gs:0,infl:0,n:0,sats:[],seed:.81};
  bodies.push(home);
  const L={bodies,asteroids,callouts,ys:bodies.map(b=>b.y),numbered:bodies.filter(b=>b.n>0),hole,home,length:home.y};
  L.spawns=[{trig:-1e9,start:true}];
  for(const r of rows){let best=0,bx=450;
    for(let i=0;i<36;i++){const x=i*25+12;let m=1e9;
      for(const b of bodies){const dy=b.y-r.mid;if(dy>700||dy<-700)continue;m=Math.min(m,Math.hypot(wdx(x,b.x),dy)-b.R)}
      if(m>best){best=m;bx=x}}
    L.spawns.push({trig:r.mid,x:bx,y:r.mid})}
  L.spawns.push({trig:hole.y+150,x:450,y:hole.y+540});
  L.droidY=L.numbered[41].y-320;
  return L;
}
function lowIdx(L,y){const a=L.ys;let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<y)lo=m+1;else hi=m}return lo}
const G={x:0,y:0};
function grav(L,x,y,out){let ax=0,ay=0;const bs=L.bodies;
  for(let i=lowIdx(L,y-RANGE);i<bs.length;i++){const b=bs[i];if(b.y>y+RANGE)break;if(!b.gs)continue;
    const dx=wdx(x,b.x),dy=b.y-y,r2=dx*dx+dy*dy;if(r2>b.infl*b.infl||r2<1)continue;
    const r=Math.sqrt(r2),rr=Math.max(r,b.R);let g=b.gs*b.R*b.R/(rr*rr);const f=(b.infl-r)/(.3*b.infl);if(f<1)g*=f;
    ax+=g*dx/r;ay+=g*dy/r}
  out.x=ax;out.y=ay}
function newState(){return{x:450,y:120+SHIP_R+3,vx:0,vy:0,a:0,t:0,landed:true,passed:0,shield:0,droid:null,droidDone:false}}
function spawnFor(L,y){let s=L.spawns[0];for(const p of L.spawns)if(p.trig<y)s=p;return s}
function placeAt(L,S,sp){S.vx=0;S.vy=0;S.a=0;
  if(sp.start){S.x=450;S.y=120+SHIP_R+3;S.landed=true}else{S.x=sp.x;S.y=sp.y;S.landed=false;S.shield=2.5}
  S.passed=0;while(S.passed<L.numbered.length&&L.numbered[S.passed].y<S.y)S.passed++}
function hitBody(L,x,y,pad){const bs=L.bodies;
  for(let i=lowIdx(L,y-RANGE);i<bs.length;i++){const b=bs[i];if(b.y>y+RANGE)break;
    const dx=wdx(x,b.x),dy=b.y-y,rr=b.R+pad;if(dx*dx+dy*dy<rr*rr)return b}
  return null}
function step(L,S,inp,dt){
  if(S.landed){if(inp.thrust)S.landed=false;else return null}
  S.t+=dt;if(S.shield>0)S.shield-=dt;
  if(inp.aim!=null){const m=TURN*1.7*dt;S.a+=clamp(wrapA(inp.aim-S.a),-m,m)}else S.a+=(inp.turn||0)*TURN*dt;
  S.a=wrapA(S.a);
  grav(L,S.x,S.y,G);let ax=G.x,ay=G.y;
  if(inp.thrust){ax+=THRUST*Math.sin(S.a);ay+=THRUST*Math.cos(S.a)}
  S.vx+=ax*dt;S.vy+=ay*dt;
  let sp=Math.hypot(S.vx,S.vy);
  if(inp.brake&&sp>0){const k=Math.max(0,sp-BRAKE*dt)/sp;S.vx*=k;S.vy*=k;sp*=k}
  if(sp>VMAX){S.vx*=VMAX/sp;S.vy*=VMAX/sp}
  S.x=wrapX(S.x+S.vx*dt);S.y+=S.vy*dt;
  if(S.y<-600)return'crash';
  while(S.passed<L.numbered.length&&L.numbered[S.passed].y<S.y)S.passed++;
  const bs=L.bodies,safe=S.shield>0;
  for(let i=lowIdx(L,S.y-RANGE);i<bs.length;i++){const b=bs[i];if(b.y>S.y+RANGE)break;
    const dx=wdx(S.x,b.x),dy=b.y-S.y,rr=b.R+SHIP_R;
    if(dx*dx+dy*dy<rr*rr)return b.type==='newearth'?'win':'crash';
    if(!safe)for(const s of b.sats){const an=s.a0+s.w*S.t,ex=dx+s.r*Math.sin(an),ey=dy+s.r*Math.cos(an),q=s.rad+SHIP_R;
      if(ex*ex+ey*ey<q*q)return'crash'}}
  if(!safe)for(const a of L.asteroids){const dy=a.y-S.y;if(dy>40||dy<-40)continue;
    const dx=wdx(S.x,a.x0+a.vx*S.t),q=a.R+SHIP_R;if(dx*dx+dy*dy<q*q)return'crash'}
  if(!S.droidDone&&S.y>L.droidY){S.droidDone=true;S.droid={x:-40,y:S.y+430,vx:150}}
  if(S.droid){const D=S.droid;D.x+=D.vx*dt;if(D.x>W+40)S.droid=null;
    else if(!safe){const dx=D.x-S.x,dy=D.y-S.y;if(dx*dx+dy*dy<(15+SHIP_R)*(15+SHIP_R))return'crash'}}
  return null}
/*SIM-END*/

if(typeof document!=='undefined'){
window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};
const DAY=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York'}).format(new Date()),QSEED=+new URLSearchParams(location.search).get('seed')||0;
fetch('robot.json').then(r=>r.json()).catch(()=>({})).then(j=>{
  if(QSEED)return boot(QSEED,(j.seeds||{})[QSEED]||null);
  const d=(j.days||{})[DAY];d?boot(d.seed,d.robot):boot(+DAY.replace(/-/g,''),null)});
function boot(SEED,ROBOT){
const track=n=>{try{window.va('event',{name:n})}catch(e){}};
const COURSE=QSEED?'Course '+SEED:new Date(DAY+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})+' course';
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const INK='#f2f2f2',BG='#050505',ACC='#6fa8ff';
const L=makeLevel(SEED);let S=newState();
let cw=0,ch=0,sc=1,x0=0,line=0,camY=S.y,dpr=1;
let mode='title',lives=3,paused=false,readyT=0,deadT=0,crashY=0,frags=[],trail=[],trailN=0,muted=false,lastTime=null;
const input={turn:0,thrust:false,brake:false,aim:null},keys={};
const stick={on:false,id:null,ox:0,oy:0,x:0,y:0};

/* ---------- layout ---------- */
function resize(){dpr=Math.min(window.devicePixelRatio||1,2.5);cw=innerWidth;ch=innerHeight;
  cv.width=cw*dpr;cv.height=ch*dpr;sc=Math.min(cw/W,ch/1000);x0=(cw-W*sc)/2;line=ch*.7}
addEventListener('resize',resize);resize();
const SX=x=>x0+x*sc,SY=y=>line-(y-camY)*sc;

/* ---------- sound ---------- */
let ac,thr,noiseBuf;
function audio(){if(ac){if(ac.state==='suspended')ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource();src.buffer=noiseBuf;src.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
  thr=ac.createGain();thr.gain.value=0;src.connect(f).connect(thr).connect(ac.destination);src.start()}
function thrustSound(on){if(thr)thr.gain.setTargetAtTime(on&&!muted?.16:0,ac.currentTime,.04)}
function boom(){if(!ac||muted)return;const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=260;
  const g=ac.createGain();g.gain.setValueAtTime(.5,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.9);
  s.connect(f).connect(g).connect(ac.destination);s.start();s.stop(ac.currentTime+1)}
function tone(f0,f1,t,d,v,type){if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain(),T=ac.currentTime+t;o.type=type||'sine';
  o.frequency.setValueAtTime(f0,T);o.frequency.exponentialRampToValueAtTime(f1,T+d);
  g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(v||.08,T+.01);g.gain.linearRampToValueAtTime(0,T+d);
  o.connect(g).connect(ac.destination);o.start(T);o.stop(T+d+.02)}
function droidBeeps(){const f=[1900,2600,1400,3100,2200,900,2800,1700,2400];let t=0;
  f.forEach((a,i)=>{const d=.07+(i%3)*.04;tone(a,f[(i+3)%f.length],t,d,.06,i%2?'square':'sine');t+=d+.03})}
function winTune(){[392,523,659,784].forEach((f,i)=>tone(f,f,i*.16,.5,.07,'triangle'))}

function setMuted(v){muted=v;try{localStorage.setItem('newearth.muted',v?'1':'')}catch(e){}
  const b=$('snd');b.innerHTML='Sound <b>'+(v?'off':'on')+'</b>';b.setAttribute('aria-pressed',String(!v));if(v)thrustSound(false)}
try{setMuted(localStorage.getItem('newearth.muted')==='1')}catch(e){}
$('snd').onclick=e=>{audio();setMuted(!muted);e.currentTarget.blur()};

/* ---------- scores ---------- */
const KEY='newearth.times.v1'+(SEED===11?'':'.'+SEED);
const loadTimes=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const saveTimes=t=>{try{localStorage.setItem(KEY,JSON.stringify(t))}catch(e){}};
const fmt=s=>{const m=Math.floor(s/60),r=s-m*60;return m+':'+(r<10?'0':'')+r.toFixed(2)};
const esc=s=>String(s).replace(/[^A-Z0-9]/gi,'').slice(0,3).toUpperCase();
function timesHTML(mark){const t=loadTimes();if(!t.length)return'';

function bindShare(s){const b=$('sh');if(!b)return;b.onclick=()=>{const text=shareText(s);track('share');

  const old=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;user-select:text;-webkit-user-select:text';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}ta.remove()};

/* ---------- loop ---------- */
const MISSION='From Earth to New Earth. Get past 100 bodies.<br>'+(matchMedia('(pointer:coarse)').matches?'Push the stick up to launch.':'Hold the up arrow to launch.');
const setCall=()=>{callI=0;while(callI<L.callouts.length&&L.callouts[callI].y<S.y-250)callI++};
let callI=0,mission=false;const STEP=1/120;let acc=0,hadDroid=false,lastPassed=-1;
function crash(){boom();thrustSound(false);crashY=S.y;lives--;drawLives();mode='dead';deadT=1.25;
  for(let i=0;i<14;i++){const a=Math.random()*6.28,v=40+Math.random()*150;frags.push({x:S.x,y:S.y,vx:Math.cos(a)*v+S.vx*.25,vy:Math.sin(a)*v+S.vy*.25,r:a,w:(Math.random()-.5)*9,s:3+Math.random()*6,l:1})}
  flash(lives>0?(lives===1?'Last ship':lives+' ships left'):'',1.3)}

      while(acc>=STEP&&mode==='play'){acc-=STEP;const ev=step(L,S,input,STEP);if(ev==='crash')crash();else if(ev==='win')win()}}
    thrustSound(mode==='play'&&input.thrust&&readyT<=0);
    if(S.droid&&!hadDroid)droidBeeps();hadDroid=!!S.droid;
    if(!S.landed&&++trailN%3===0){trail.push({x:S.x,y:S.y});if(trail.length>46)trail.shift()}
    if(S.passed!==lastPassed){lastPassed=S.passed;$('count').innerHTML='<b>'+String(S.passed).padStart(3,'0')+'</b> / 100';
      }
    while(callI<L.callouts.length&&L.callouts[callI].y<S.y)flash(L.callouts[callI++].text,3);
    if(mission&&!S.landed){mission=false;subT=.01}
    $('clock').textContent=fmt(S.t)}

    if(lives>0){placeAt(L,S,spawnFor(L,crashY));setCall();if(S.landed){mission=true;flash(MISSION,1e9)}mode='play';readyT=.7;acc=0}else over()}}
  for(const f of frags){f.x+=f.vx*dt;f.y+=f.vy*dt;f.r+=f.w*dt;f.l-=dt*.85}
  if(subT>0&&subT<1e8){subT-=dt;if(subT<=0)sub.classList.remove('on')}
  const look=mode==='play'?clamp(S.vy*.22,-90,130):0;camY+=(S.y+look-camY)*Math.min(1,dt*6);
  render(S.t)}
title();requestAnimationFrame(frame);
